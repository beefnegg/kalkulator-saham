<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalkulator Saham</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-weak: #dbeafe;
      --success-bg: #f0fdf4;
      --success-border: #bbf7d0;
      --success-text: #065f46;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      min-height: 100%;
      display: grid;
      place-items: start center;
      padding: 24px 16px 40px;
    }
    .card {
      width: 100%;
      max-width: 600px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px 28px 24px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
    }
    .header h1 {
      font-size: 22px;
      margin: 0;
      letter-spacing: -0.2px;
    }
    .reset {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 8px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
    }
    .reset:hover { background: #f9fafb; }
    .section + .section { margin-top: 22px; }
    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 12px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 520px) {
      .grid { grid-template-columns: 1fr; }
      .card { padding: 20px 16px 18px; }
      .header h1 { font-size: 20px; }
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fafafa;
      font-size: 16px;
      color: var(--text);
      transition: 0.2s ease;
    }
    input:focus {
      outline: none;
      background: #fff;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-weak);
    }
    .output {
      margin-top: 14px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #f8fafc;
    }
    .output .label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
    }
    .output .value {
      font-size: 18px;
      font-weight: 800;
      color: #0b1220;
      word-break: break-word;
    }
    .output.empty .value { color: #9ca3af; font-weight: 600; }
    .result {
      margin-top: 22px;
      padding: 18px 18px 16px;
      border: 1px solid var(--success-border);
      background: var(--success-bg);
      border-radius: 16px;
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 6px 0;
    }
    .result-row + .result-row { border-top: 1px dashed #d1fae5; }
    .result-label { color: #064e3b; font-weight: 600; font-size: 14px; }
    .result-value { color: var(--success-text); font-weight: 800; font-size: 16px; text-align: right; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="header">
        <h1>Kalkulator Saham</h1>
        <button class="reset" id="resetBtn" type="button">Reset</button>
      </div>

      <div class="section">
        <div class="section-title">Info Saham</div>
        <div class="grid">
          <div>
            <label for="kodeSaham">Kode Saham (IDX)</label>
            <input id="kodeSaham" type="text" inputmode="text" placeholder="Contoh: BBCA" />
          </div>
          <div>
            <label for="hargaSaham">Harga Saham sekarang (Rp)</label>
            <input id="hargaSaham" type="number" inputmode="numeric" min="0" step="1" placeholder="0" />
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Pembelian Awal</div>
        <div class="grid">
          <div>
            <label for="nominalAwal">Nominal Awal (Rp)</label>
            <input id="nominalAwal" type="number" inputmode="numeric" min="0" step="1" placeholder="0" />
          </div>
          <div>
            <label for="lotAwal">Lot Awal</label>
            <input id="lotAwal" type="number" inputmode="numeric" min="0" step="1" placeholder="0" />
          </div>
        </div>
        <div class="output" id="avgAwalBox">
          <div class="label">AVG Awal</div>
          <div class="value empty" id="avgAwal">—</div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Pembelian Tambah</div>
        <div class="grid">
          <div>
            <label for="hargaTambah">Harga Tambah (Rp)</label>
            <input id="hargaTambah" type="number" inputmode="numeric" min="0" step="1" placeholder="0" />
          </div>
          <div>
            <label for="lotTambah">Lot Tambah</label>
            <input id="lotTambah" type="number" inputmode="numeric" min="0" step="1" placeholder="0" />
          </div>
        </div>
        <div class="output" id="nominalTambahBox">
          <div class="label">Nominal Tambah</div>
          <div class="value empty" id="nominalTambah">—</div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Hasil Akhir</div>
        <div class="result">
          <div class="result-row">
            <div class="result-label">Nominal Akhir</div>
            <div class="result-value" id="nominalAkhir">Rp 0</div>
          </div>
          <div class="result-row">
            <div class="result-label">Lot Akhir</div>
            <div class="result-value" id="lotAkhir">0 lot</div>
          </div>
          <div class="result-row">
            <div class="result-label">AVG Akhir</div>
            <div class="result-value" id="avgAkhir">Rp 0</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const nominalAwal = document.getElementById('nominalAwal');
    const lotAwal = document.getElementById('lotAwal');
    const hargaTambah = document.getElementById('hargaTambah');
    const lotTambah = document.getElementById('lotTambah');

    const avgAwalEl = document.getElementById('avgAwal');
    const avgAwalBox = document.getElementById('avgAwalBox');
    const nominalTambahEl = document.getElementById('nominalTambah');
    const nominalTambahBox = document.getElementById('nominalTambahBox');
    const nominalAkhirEl = document.getElementById('nominalAkhir');
    const lotAkhirEl = document.getElementById('lotAkhir');
    const avgAkhirEl = document.getElementById('avgAkhir');
    const resetBtn = document.getElementById('resetBtn');

    const kodeSaham = document.getElementById('kodeSaham');
    const hargaSahamEl = document.getElementById('hargaSaham');

    const fmt = (n) => {
      if (!Number.isFinite(n)) return 'Rp 0';
      return 'Rp ' + Math.round(n).toLocaleString('id-ID');
    };
    const setBox = (box, el, text, filled) => {
      el.textContent = text;
      if (filled) {
        box.classList.remove('empty');
        el.classList.remove('empty');
      } else {
        box.classList.add('empty');
        el.classList.add('empty');
      }
    };

    const calc = () => {
      const na = parseFloat(nominalAwal.value) || 0;
      const la = parseFloat(lotAwal.value) || 0;
      const ht = parseFloat(hargaTambah.value) || 0;
      const lt = parseFloat(lotTambah.value) || 0;

      const lembarAwal = la * 100;
      const avgA = lembarAwal > 0 ? na / lembarAwal : 0;

      const lembarTambah = lt * 100;
      const nomT = ht * lembarTambah;
      const nomAkhir = na + nomT;
      const lotAkhir = la + lt;
      const avgAkhir = (lotAkhir * 100) > 0 ? nomAkhir / (lotAkhir * 100) : 0;

      const hasAwal = nominalAwal.value !== '' && lotAwal.value !== '';
      const hasTambah = hargaTambah.value !== '' && lotTambah.value !== '';

      setBox(avgAwalBox, avgAwalEl, hasAwal && avgA > 0 ? fmt(avgA) : '—', hasAwal && avgA > 0);
      setBox(nominalTambahBox, nominalTambahEl, hasTambah && nomT > 0 ? fmt(nomT) : '—', hasTambah && nomT > 0);

      nominalAkhirEl.textContent = fmt(nomAkhir);
      lotAkhirEl.textContent = lotAkhir + ' lot';
      avgAkhirEl.textContent = fmt(avgAkhir);
    };

    const setHargaSaham = (value) => {
      hargaSahamEl.value = value;
      calc();
    };

    const fetchHarga = async () => {
      const raw = (kodeSaham.value || '').trim();
      const ticker = raw ? `${raw.toUpperCase()}.JK` : '';

      if (!ticker) {
        setHargaSaham('');
        return;
      }

      try {
        const res = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}`);
        if (!res.ok) throw new Error('Gagalmemuat');
        const data = await res.json();
        const price = data?.chart?.result?.[0]?.meta?.regularMarketPrice;
        if (!Number.isFinite(price)) throw new Error('Harga tiak ditemukan');
        setHargaSaham(Math.round(price));
      } catch (e) {
        setHargaSaham('');
      }
    };

    kodeSaham.addEventListener('input', async () => {
      const val = (kodeSaham.value || '').trim();
      if (!val) {
        setHargaSaham('');
        return;
      }
      if (!/^[A-Z0-9.]{1,10}$/i.test(val)) return;
      await fetchHarga();
    });

    const reset = () => {
      [nominalAwal, lotAwal, hargaTambah, lotTambah, kodeSaham, hargaSahamEl].forEach((el) => { el.value = ''; });
      calc();
    };

    [nominalAwal, lotAwal, hargaTambah, lotTambah, hargaSahamEl].forEach((el) => el.addEventListener('input', calc));
    resetBtn.addEventListener('click', reset);
  </script>
</body>
</html>
